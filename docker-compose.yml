services:
  # 1. PostgreSQL (Primary Database)
  postgres:
    image: postgres:18-alpine
    container_name: order_engine_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_18:/var/lib/postgresql/data 
    networks:
      - backend_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Message Broker & Cache)
  redis:
    image: redis:8-alpine 
    container_name: order_engine_redis
    environment: 
      REDIS_PASSWORD: ${REDIS_PASSWORD} 
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    networks:
      - backend_net
    restart: always
    # REQUIRED: Healthcheck to ensure Redis is up AND authenticated
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Persist data
volumes:
  pgdata_18: # Renamed volume
  redisdata:

networks:
  backend_net:
    driver: bridge